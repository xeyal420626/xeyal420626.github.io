 <!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Xeyalın Saytı</title>
    <style>
        body { 
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #000000);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 20px;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        h1 { margin-top: 30px; font-size: 30px; color: #00ff00; }
        img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid #00ff00;
            object-fit: cover;
            display: block;
            margin: 25px auto;
            box-shadow: 0 0 25px #00ff00;
        }
        button {
            background: #00ff00;
            color: black;
            padding: 12px 24px;
            border: none;
            font-size: 16px;
            border-radius: 8px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>Xoş Gəlmisən Qaqa!</h1>
    <p>Bu mənim ilk saytımdır. Kodla düzəltdim.</p>
    <img src="https://i.imgur.com/8QfXh3k.jpeg">
    <br>
    <button onclick="alert('Sağ ol qaqa! ❤️')">Like elə qaqa</button>
    <br>
    <a href="https://instagram.com/xeyal_life_">
        <button>Mənim İnstaqramım</button>
    </a>
</body>
</html>
