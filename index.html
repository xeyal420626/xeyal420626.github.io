<!DOCTYPE html>
<html>
<head>
    <title>Xəyalın Saytı</title>
    <meta charset="UTF-8">
    <style>
        body { 
    background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #000000);
    background-size: 400% 400%;
    animation: gradient 15s ease infinite;
    color: white;
    font-family: Arial;
}

@keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
        }
        img {
            width: 250px; 
            border: 3px solid #00ff00; 
            border-radius: 10px;
        }
        button {
            background-color: #00ff00; 
            color: black; 
            padding: 12px 24px; 
            border: none; 
            font-size: 16px; 
            border-radius: 8px; 
            margin: 5px;
        }
    </styleimg {
    width: 250px;
    height: 250px;
    border-radius: 50%;
    border: 5px solid #00ff00;
    object-fit: cover;
    display: block;
    margin: 20px auto;
}>
</head>
<body>
    <h1>Xoş Gəlmisən Qaqa!</h1>

</html>
